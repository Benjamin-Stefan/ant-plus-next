version: 2
# Low-maintenance setup: at most one grouped PR per ecosystem and quarter.
# Major version upgrades are not proposed; do them manually when the
# project is actively developed again. Security updates are unaffected
# by the schedule and arrive as one grouped PR when an advisory appears.
updates:
    # npm dependencies
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "quarterly"
      open-pull-requests-limit: 2
      commit-message:
          prefix: "chore"
          include: "scope"
      labels:
          - "dependencies"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          npm-dependencies:
              applies-to: version-updates
              patterns:
                  - "*"
          security-updates:
              applies-to: security-updates
              patterns:
                  - "*"

    # GitHub Actions updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "quarterly"
      open-pull-requests-limit: 1
      commit-message:
          prefix: "chore(ci)"
      labels:
          - "github-actions"
          - "dependencies"
      groups:
          github-actions:
              patterns:
                  - "*"
